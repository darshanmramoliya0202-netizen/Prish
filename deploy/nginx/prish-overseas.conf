# /etc/nginx/conf.d/prish-overseas.conf  —  prishoverseas.com (Next.js on :3000, Umami on :3001)
# Other server blocks on this VM (erp.conf, office*.conf, attendy.conf, m8-frontends.conf,
# admin-tools.conf) are separate and untouched.
# Certbot manages the ssl_certificate lines in the 443 block (cert already issued for
# www.prishoverseas.com + prishoverseas.com).

server {
    listen 80;
    server_name www.prishoverseas.com prishoverseas.com;
    return 301 https://www.prishoverseas.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.prishoverseas.com prishoverseas.com;

    ssl_certificate /etc/letsencrypt/live/www.prishoverseas.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.prishoverseas.com/privkey.pem; # managed by Certbot

    if ($host != 'www.prishoverseas.com') {
        return 301 https://www.prishoverseas.com$request_uri;
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    client_max_body_size 1m;

    # Brochure and other files the mail-CRM links from outreach mail. Served straight
    # from disk; the Next.js app never sees these paths. (Pre-dates v3 — keep.)
    location /brochure/ {
        alias /opt/prish-overseas/public/brochure/;
        add_header Cache-Control "public, max-age=86400";
        types { application/pdf pdf; }
        default_type application/pdf;
    }

    # Umami (cookie-free analytics) — same origin, no DNS change. Harmless until Umami
    # is installed on :3001 (deploy/umami/README.md); the app only loads the script when
    # NEXT_PUBLIC_UMAMI_WEBSITE_ID is set.
    location /umami/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Next static assets (content-hashed)
    location /_next/static {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Generated PDFs
    location /downloads/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
